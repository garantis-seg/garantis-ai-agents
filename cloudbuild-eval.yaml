# garantis-ai-agents — PromptFoo regression eval (L1 mov_factsheet).
#
# Split out of cloudbuild-deploy.yaml on 2026-06-01 so it no longer gates the
# deploy build. It is WARNING-ONLY (never fails the build), so gating deploy on
# it gave zero safety while adding ~120s of wall-clock to every deploy. It now
# runs as its own build via trigger `eval-garantis-ai-agents` on every push to
# master, in parallel with the deploy build and off its critical path.
#
# Skip se golden snapshot ainda nao commitado em evals/promptfoo/golden/.
# Pra virar GATE REAL: re-incorporar como step do deploy + remover os `exit 0`.
# Doc: evals/promptfoo/README.md
steps:
  - name: 'python:3.11-slim'
    id: 'promptfoo-eval'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set +e  # warning-only: nao falha o step

        # Skip se snapshot nao existe (P5.1 = estrutura, P5.2 = snapshot commitado)
        if [ ! -f evals/promptfoo/golden/snapshot_v1.yaml ]; then
          echo "::warning::No golden snapshot at evals/promptfoo/golden/snapshot_v1.yaml — skipping eval"
          exit 0
        fi

        echo "[promptfoo] installing Node 20 + Python deps..."
        apt-get update -qq
        apt-get install -y -qq curl gnupg ca-certificates
        curl -fsSL https://deb.nodesource.com/setup_20.x | bash - >/dev/null 2>&1
        apt-get install -y -qq nodejs

        echo "[promptfoo] installing Python deps (garantis-shared via keyring)..."
        pip install --quiet --no-cache-dir keyrings.google-artifactregistry-auth
        PIP_EXTRA_INDEX_URL=https://southamerica-east1-python.pkg.dev/$PROJECT_ID/python-packages/simple/ \
          pip install --quiet --no-cache-dir -r requirements.txt

        echo "[promptfoo] running eval (max-concurrency=5)..."
        cd evals/promptfoo
        npm ci --silent
        npx promptfoo eval --output results.json --max-concurrency 5 || {
          echo "::warning::PromptFoo eval FAILED (or threshold not met) — warning-only mode active"
          exit 0
        }
        echo "[promptfoo] eval passed"
    # GEMINI_BACKEND=vertex: eval roda em Vertex por DEFAULT (paridade com prod +
    # sem o spending cap do AI Studio). Auth = ADC do SA do Cloud Build
    # (394302633873@cloudbuild.gserviceaccount.com, roles/aiplatform.user).
    # A key GEMINI_API_KEY_EVAL abaixo segue injetada como FALLBACK aistudio
    # (flipar removendo esta env ou setando GEMINI_BACKEND=aistudio).
    env: ['GEMINI_BACKEND=vertex']
    secretEnv: ['GEMINI_API_KEY']
    timeout: '300s'

availableSecrets:
  secretManager:
    # GEMINI_API_KEY_EVAL: key DEDICADA do eval (API key GCP restrita a
    # generativelanguage.googleapis.com, quota separada) — hoje FALLBACK aistudio
    # (backend default do eval = vertex via env acima; a key só é usada se
    # GEMINI_BACKEND voltar pra aistudio). NUNCA usar a
    # GEMINI_API_KEY de prod aqui — o promptfoo roda direto do build container
    # (bypassa o rate-limiter do ai-agents) a cada push em master, e dividir a
    # key saturava a quota do cascade user-facing (incidente fila congelada
    # 2026-06-10, findings dbos-cascade-resilience-2026-06-10).
    - versionName: projects/$PROJECT_ID/secrets/GEMINI_API_KEY_EVAL/versions/latest
      env: 'GEMINI_API_KEY'

options:
  logging: CLOUD_LOGGING_ONLY
