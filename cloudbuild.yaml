steps:
  # Build + push with Kaniko (cache enabled — pip install cached when requirements.txt unchanged)
  - name: 'gcr.io/kaniko-project/executor:latest'
    args:
      - '--dockerfile=Dockerfile'
      - '--context=.'
      - '--destination=southamerica-east1-docker.pkg.dev/$PROJECT_ID/garantis-ai-agents/api:$COMMIT_SHA'
      - '--destination=southamerica-east1-docker.pkg.dev/$PROJECT_ID/garantis-ai-agents/api:latest'
      - '--cache=true'
      - '--cache-ttl=168h'
      - '--cache-repo=southamerica-east1-docker.pkg.dev/$PROJECT_ID/garantis-ai-agents/api-cache'
      - '--snapshot-mode=redo'
    timeout: '600s'

  # Deploy container image to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'garantis-ai-agents'
      - '--image'
      - 'southamerica-east1-docker.pkg.dev/$PROJECT_ID/garantis-ai-agents/api:$COMMIT_SHA'
      - '--region'
      - 'southamerica-east1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--memory'
      - '1Gi'
      - '--timeout'
      - '300'
      # CRÍTICO: --set-env-vars SUBSTITUI todas as env vars. Este cloudbuild estava
      # STALE (só 2 vars) — um deploy DERRUBARIA as 5 flags vivas (TEMPLATES_POLETTO,
      # BLOQUEIO_PROB_EXITO, JURISPRUDENCE_PATH, L3_AB_TEST, L1_NEUTRAL) setadas via
      # gcloud --update-env-vars. Persistidas aqui (defesa contra cross-session reset).
      # Espelho EXATO do services.yaml garantis-ai-agents — atualizar OS DOIS juntos.
      - '--set-env-vars'
      - 'DEFAULT_MODEL=gemini-2.5-flash-lite,DEFAULT_PROMPT_VERSION=v3,TEMPLATES_POLETTO_ENABLED=true,BLOQUEIO_PROB_EXITO_ENABLED=true,JURISPRUDENCE_PATH_ENABLED=new,L3_AB_TEST_ENABLED=true,L1_NEUTRAL_ENABLED=true,VISION_L1_ENABLED=true'
      - '--set-secrets'
      - 'GOOGLE_API_KEY=GEMINI_API_KEY:latest'

options:
  logging: CLOUD_LOGGING_ONLY
