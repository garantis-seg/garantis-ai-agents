steps:
  # Build the container image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'southamerica-east1-docker.pkg.dev/$PROJECT_ID/garantis-ai-agents/api:$COMMIT_SHA', '.']

  # Push the container image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'southamerica-east1-docker.pkg.dev/$PROJECT_ID/garantis-ai-agents/api:$COMMIT_SHA']

  # Deploy container image to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'garantis-ai-agents'
      - '--image'
      - 'southamerica-east1-docker.pkg.dev/$PROJECT_ID/garantis-ai-agents/api:$COMMIT_SHA'
      - '--region'
      - 'southamerica-east1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--memory'
      - '1Gi'
      - '--timeout'
      - '300'
      - '--set-env-vars'
      - 'DEFAULT_MODEL=gemini-2.0-flash-lite,DEFAULT_PROMPT_VERSION=v3'
      - '--set-secrets'
      - 'GOOGLE_API_KEY=GEMINI_API_KEY:latest'

images:
  - 'southamerica-east1-docker.pkg.dev/$PROJECT_ID/garantis-ai-agents/api:$COMMIT_SHA'

options:
  logging: CLOUD_LOGGING_ONLY
