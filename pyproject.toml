[project]
name = "garantis-ai-agents"
version = "0.6.0"
description = "Repositório centralizado de AI Agents com suporte a múltiplos LLM providers"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Garantis", email = "dev@garantis.com.br"}
]

# ⛔ Sem `dependencies` aqui, de proposito (2026-09-17). As deps de runtime moram SO
# no `requirements.txt`: e ele que o Dockerfile e o step `unit-tests` do
# cloudbuild-deploy.yaml instalam, e e so ele que o bot de bump do garantis-shared
# edita. A copia que vivia aqui ja tinha divergido (shared `>=1.19.1` contra
# `==1.630.0`, e sem PyMuPDF/pypdf/google-cloud-storage) — uma segunda lista a mao
# nunca e a que roda. Instalar local: `pip install -r requirements.txt`.

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.28.0",
    # mesmo pin do step `unit-tests` (regra nova de versao nova nao pode pintar o gate)
    "ruff==0.15.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
# Checkouts aninhados (worktrees de sessao) nao sao este repo e nao estao no .gitignore.
extend-exclude = [".wt", ".worktrees", ".claude"]

[tool.ruff.lint]
# Roda como TESTE (tests/test_ruff.py), e a suite e o gate do deploy. "I" (ordem de
# import) ficou de fora de proposito: zerar = reescrever ~48 arquivos sem ganho, e
# conflita com branch em voo. E501 idem (prompts longos sao a norma aqui).
select = ["E", "F", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
