# Staging-ISOLADO (garantis-ai-agents-staging): build Kaniko + deploy com FLAGS PERSISTIDAS.
# O deploy usa `run services update` com --update-env-vars (ADITIVO): preserva
# DB_HOST do clone (muda a cada refresh-staging-from-prod) e secrets, e
# RE-ASSERTA as flags que antes evaporavam (aplicadas so a mao via
# --update-env-vars). Fonte das flags: memoria prod-congelado-demo-staging-env
# + convergencia seed/monotonic/MAX-K + frescor 2026-07-02.
# Uso: cd . && gcloud builds submit --config=cloudbuild-staging-build.yaml .
steps:
  - name: 'gcr.io/kaniko-project/executor:latest'
    args:
      - '--dockerfile=Dockerfile'
      - '--context=.'
      - '--destination=southamerica-east1-docker.pkg.dev/neqsti/garantis-ai-agents/api:staging-latest'
      - '--cache=true'
      - '--cache-ttl=168h'
      - '--cache-repo=southamerica-east1-docker.pkg.dev/neqsti/garantis-build-cache/garantis-ai-agents-cache'
    timeout: '900s'
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim'
    entrypoint: gcloud
    args:
      - 'run'
      - 'services'
      - 'update'
      - 'garantis-ai-agents-staging'
      - '--image=southamerica-east1-docker.pkg.dev/neqsti/garantis-ai-agents/api:staging-latest'
      # GEMINI_BACKEND=vertex (2026-07-20): espelha prod (cloudbuild-deploy.yaml:84) — flip do spending cap AI Studio.
      # CALCULO_FICHA_MODEL + AUDITOR_EVIDENCIAS_MODEL (2026-08-13, QA B1 achado A-1):
      # espelha prod. Aqui e ainda mais necessario que la: o --update-env-vars e ADITIVO,
      # entao o DEFAULT_MODEL que ja mora no clone SOBREVIVE a cada deploy — e sem estas
      # duas os agentes do C4 colapsam no mesmo modelo, com o staging ensaiando um
      # comportamento que prod nao tem. Valores = defaults do codigo; modelos DISTINTOS
      # e o ponto, nao a escolha especifica.
      # ⚠️ CALCULO_FICHA_MODEL 3.1-pro-preview -> 3.5-flash (2026-08-13, decisao do dono):
      # o preview dava 404 no Vertex e, fora do catalogo MODELS, zerava o custo no ledger.
      # Espelha prod (cloudbuild-deploy.yaml). Detalhe do bug la e em calculo_ficha/agent.py.
      # FICHA_AUDITORIA_TEXTO_MODEL (2026-08-13, S6): doutrina do A-1 para o par
      # redator(S4) x auditor(S6) — o auditor NAO herda DEFAULT_MODEL no codigo; a env
      # explicita garante que staging ensaie o par real. Precisa ser != FICHA_WRITER_MODEL.
      # (resolucao 155x156: S6 em 3.5-flash — o 2.5-flash aposenta 2026-10-16.)
      - '--update-env-vars=ENGINE_LLM_SEED_ENABLED=true,GEMINI_BACKEND=vertex,CALCULO_FICHA_MODEL=gemini-3.5-flash,AUDITOR_EVIDENCIAS_MODEL=gemini-2.5-flash,FICHA_WRITER_MODEL=gemini-3.1-flash-lite,FICHA_AUDITORIA_TEXTO_MODEL=gemini-3.5-flash'
      # ⭐ O PAR do --update-env-vars acima, e a razao e ele: sendo ADITIVO, env que
      # some do repo NUNCA some do servico — ela fica viva no clone pra sempre.
      # Padrao copiado do irmao `execucao-fiscal/risk-engine-worker/
      # cloudbuild-staging-build.yaml`, que ja carrega esta lista.
      # ⛔ NAO troque por um `gcloud run services update --remove-env-vars` a mao:
      # o proximo build aditivo NAO a remove, mas tambem nao a repoe — o que volta
      # e o proximo `refresh-staging-from-prod`, e ai a limpeza se desfaz calada.
      # ⚠️ Env inexistente em `--remove-env-vars` e NO-OP, entao a linha e idempotente
      # e uma env ja removida pode ficar aqui sem custo.
      #
      # L3_AB_TEST_ENABLED (card 869ejape0, item 3): a flag foi REMOVIDA DO CODIGO
      # na poda de 2026-07-05 (`garantis_shared/engine_v6/feature_flags.py`) e as 5
      # ocorrencias que restam nos 4 repos sao LAPIDE — zero leitor, verificado
      # 2026-08-24. Ela seguia `=true` no `garantis-ai-agents-staging` justamente
      # por este cloudbuild ser aditivo. ⚠️ Nao economiza nada hoje; o que desarma
      # e a mina: se um leitor com esse NOME voltar, staging liga sozinho 4 chamadas
      # LLM extras do L3 (~US$0,02/cascade, `execucao-fiscal/config/services.yaml`)
      # sem ninguem ter decidido.
      # ⛔ SECRET nao sai por --remove-env-vars (mesma ressalva do irmao).
      - '--remove-env-vars=L3_AB_TEST_ENABLED'
      - '--region=southamerica-east1'
      - '--project=neqsti'
timeout: '1500s'
options:
  logging: CLOUD_LOGGING_ONLY
