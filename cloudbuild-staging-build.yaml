# Staging-ISOLADO (garantis-ai-agents-staging): build Kaniko + deploy com FLAGS PERSISTIDAS.
# O deploy usa `run services update` com --update-env-vars (ADITIVO): preserva
# DB_HOST do clone (muda a cada refresh-staging-from-prod) e secrets, e
# RE-ASSERTA as flags que antes evaporavam (aplicadas so a mao via
# --update-env-vars). Fonte das flags: memoria prod-congelado-demo-staging-env
# + convergencia seed/monotonic/MAX-K + frescor 2026-07-02.
# Uso: cd . && gcloud builds submit --config=cloudbuild-staging-build.yaml .
steps:
  - name: 'gcr.io/kaniko-project/executor:latest'
    args:
      - '--dockerfile=Dockerfile'
      - '--context=.'
      - '--destination=southamerica-east1-docker.pkg.dev/neqsti/garantis-ai-agents/api:staging-latest'
      - '--cache=true'
      - '--cache-ttl=168h'
      - '--cache-repo=us-docker.pkg.dev/neqsti/garantis-build-cache/garantis-ai-agents-cache'
    timeout: '900s'
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim'
    entrypoint: gcloud
    args:
      - 'run'
      - 'services'
      - 'update'
      - 'garantis-ai-agents-staging'
      - '--image=southamerica-east1-docker.pkg.dev/neqsti/garantis-ai-agents/api:staging-latest'
      # GEMINI_BACKEND=vertex (2026-07-20): espelha prod (cloudbuild-deploy.yaml:84) — flip do spending cap AI Studio.
      # ⛔ Nenhuma env de modelo aqui: o modelo de cada agent sai do papel em
      # garantis_shared.llm_models, igual a prod.
      - '--update-env-vars=ENGINE_LLM_SEED_ENABLED=true,GEMINI_BACKEND=vertex'
      # PAR do --update-env-vars acima, que sendo ADITIVO nunca REMOVE: env que sai
      # do repo fica viva no servico pra sempre. Padrao copiado do irmao
      # `execucao-fiscal/risk-engine-worker/cloudbuild-staging-build.yaml`.
      # ⛔ Nao troque por um `gcloud ... --remove-env-vars` a mao: o proximo
      # `refresh-staging-from-prod` desfaz a limpeza, calado.
      # `L3_AB_TEST_ENABLED`: sem leitor desde a poda de 2026-07-05 (card 869ejape0).
      # As envs de modelo: sem leitor desde que cada agent le o modelo do papel.
      - '--remove-env-vars=L3_AB_TEST_ENABLED,DEFAULT_MODEL,CALCULO_FICHA_MODEL,AUDITOR_EVIDENCIAS_MODEL,FICHA_WRITER_MODEL,FICHA_AUDITORIA_TEXTO_MODEL,MOV_TRIAGE_MODEL'
      - '--region=southamerica-east1'
      - '--project=neqsti'
timeout: '1500s'
options:
  logging: CLOUD_LOGGING_ONLY
