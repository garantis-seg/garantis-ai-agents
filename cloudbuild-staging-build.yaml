# Staging-only: build the ai-agents image with Kaniko (same builder as prod, which
# handles the .dockerignore *.md vs COPY README.md correctly) and push to a staging
# tag. NO deploy step — the -staging service is updated separately. Not used by any
# trigger; manual `gcloud builds submit --config=cloudbuild-staging-build.yaml .`.
steps:
  - name: 'gcr.io/kaniko-project/executor:latest'
    args:
      - '--dockerfile=Dockerfile'
      - '--context=.'
      - '--destination=southamerica-east1-docker.pkg.dev/neqsti/garantis-ai-agents/api:staging-frescor'
      - '--cache=true'
      - '--cache-ttl=168h'
      - '--cache-repo=southamerica-east1-docker.pkg.dev/neqsti/garantis-ai-agents/api-cache'
options:
  logging: CLOUD_LOGGING_ONLY
