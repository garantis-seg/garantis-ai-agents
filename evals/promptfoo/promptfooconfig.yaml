description: Engine v6 L1 mov_factsheet regression suite

# Provider Python custom: chama src.agents.mov_factsheet.classify_mov_factsheet
# direto. Cobre prompt rendering + Gemini call + parse + Pydantic validation.
providers:
  - id: 'python:providers/mov_factsheet_provider.py'
    label: l1-mov-factsheet-current

prompts:
  # PromptFoo exige `prompts:` mas o provider custom ignora — o prompt real
  # é construído dentro do agente por build_mov_factsheet_prompt(). Stub.
  - "{{processo.cnj}}::{{mov.mov_id}}"

# Golden suites — 2 fontes:
# 1. snapshot_v1.yaml: 30 cases random do banco (regression no-drift)
# 2. polo_regression_v1.yaml: 10 cards CURADOS pros casos criticos polo
#    (gate forte contra regressao em REGRA DE LEITURA DE POLOS)
tests:
  - file://golden/snapshot_v1.yaml
  - file://golden/polo_regression_v1.yaml

defaultTest:
  assert:
    # Output deve ser JSON parseável (Pydantic já garantiu — sanity check)
    - type: is-json
      weight: 1

    # Campos categóricos — asserts CONDITIONAL: so falha quando expected
    # definiu o campo. Permite que goldens parciais (polo_regression cura
    # so o que importa) coexistam com goldens completos (snapshot_v1 do banco).
    # Quando expected NAO define um campo, assert passa por default — sem
    # mascarar regressao se golden tiver o campo.
    - type: javascript
      weight: 5
      value: |
        const out = JSON.parse(output);
        const exp = context.vars.expected || {};
        if (exp.decisao?.sentido === undefined) return true;
        return out.decisao?.sentido === exp.decisao?.sentido;
    - type: javascript
      weight: 5
      value: |
        const out = JSON.parse(output);
        const exp = context.vars.expected || {};
        if (exp.decisao?.transito_certificado === undefined) return true;
        return out.decisao?.transito_certificado === exp.decisao?.transito_certificado;
    - type: javascript
      weight: 4
      value: |
        const out = JSON.parse(output);
        const exp = context.vars.expected || {};
        if (exp.categoria === undefined || exp.categoria === null) return true;
        return out.categoria === exp.categoria;
    - type: javascript
      weight: 3
      value: |
        const out = JSON.parse(output);
        const exp = context.vars.expected || {};
        if (exp.relevancia_merito === undefined || exp.relevancia_merito === null) return true;
        return out.relevancia_merito === exp.relevancia_merito;
    - type: javascript
      weight: 3
      value: |
        const out = JSON.parse(output);
        const exp = context.vars.expected || {};
        if (exp.peca_pivo?.e_pivo === undefined) return true;
        return out.peca_pivo?.e_pivo === exp.peca_pivo?.e_pivo;
    - type: javascript
      weight: 2
      value: |
        const out = JSON.parse(output);
        const exp = context.vars.expected || {};
        if (exp.delta_risco?.direcao === undefined || exp.delta_risco?.direcao === null) return true;
        return out.delta_risco?.direcao === exp.delta_risco?.direcao;

    # decisao.natureza (so quando golden definiu — polo_regression usa pra
    # garantir que extincao_sem_merito eh detectado)
    - type: javascript
      weight: 3
      value: |
        const out = JSON.parse(output);
        const exp = context.vars.expected || {};
        if (exp.decisao?.natureza === undefined || exp.decisao?.natureza === null) return true;
        return out.decisao?.natureza === exp.decisao?.natureza;

    # decisao.instancia (so quando golden definiu)
    - type: javascript
      weight: 2
      value: |
        const out = JSON.parse(output);
        const exp = context.vars.expected || {};
        if (exp.decisao?.instancia === undefined || exp.decisao?.instancia === null) return true;
        return out.decisao?.instancia === exp.decisao?.instancia;

    # Texto-livre — variance residual aceitavel, so checa que NAO esta vazio.
    # Pra similarity real (embedding), precisaria provider de embeddings — fica
    # como TODO se quiser ativar (config: --providers openai:text-embedding-3-small).
    - type: javascript
      weight: 1
      value: |
        const out = JSON.parse(output);
        return (out.resumo_ato || '').length > 10;

# Threshold global: media ponderada dos asserts.
# 0.85 = no-regression (snapshot é gabarito → 100% esperado em greenfield).
# Margem 0.15 cobre variance residual de texto-livre (similarity 0.80 vs 1.00).
# Cloud Build step adiciona `|| true` no início (modo warning) — vira gate
# real depois de validar estabilidade.
sharing: false

outputPath:
  - results.json
