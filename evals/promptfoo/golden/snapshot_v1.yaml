      texto: "RELACAO ENCAMINHADA AO D J - Relação: 0175/2022\r\nTeor do ato: Vistos. Defiro o depósito pretendido pelas impetrantes,\
        \ para fins de suspensão da exigibilidade dos débitos referentes ao ICMS/DIFAL em discussão nestes autos, conforme\
        \ disposto no art. 151, inc. II, do Código Tributário Nacional. Os depósitos judiciais realizados, aliás, destinam-se\
        \ a afastar o ônus da mora em face da Fazenda Pública, eis que equivalem ao recolhimento do tributo devido nas hipóteses\
        \ descritas nos autos, não podendo as impetrantes, por conseguinte, sofrerem quaisquer restrições ou sanções impostas\
        \ pelo Fisco Estadual, como por exemplo apreensão de mercadorias, inclusão dos débitos nas guias de imposto e apuração\
        \ de ICMS, inscrição em órgão de proteção ao crédito etc. Considerando a interposição de recursos de apelação, intimem-se,\
        \ com urgência os recorridos para, querendo, oferecer contrarrazões, no prazo legal, nos termos do art. 1.010, § 1°,\
        \ do CPC, observando a prerrogativa do art. 183 do mesmo códex. Apresentadas estas, observe a escrivania ao disposto\
        \ no do art. 1.009, § 2º, do CPC. Em caso de interposição de apelação adesiva pelo apelado, deverá o apelante ser\
        \ intimado para contra-arrazoar, conforme disposto no art. 1.010, § 2°, do mesmo códex. Após, transcorridos os prazos,\
        \ remetam-se os presentes autos ao Egrégio Tribunal de Justiça deste Estado, independentemente de novas conclusões,\
        \ para processamento do apelo, a quem compete, inclusive, verificar a presença dos requisitos de admissibilidade recursal.\
        \ Cumpra-se.\r\nAdvogados(s): Bruna Dias Miguel (OAB 299816/SP)"
