- description: L1 publicacao/alta — A C Ó R D Ã O   (5ª Turma)   GMMAR/arcs/abn      AGRAVO EM AGRAVO DE INSTRUMENTO
  vars:
    processo:
      cnj: 0001826-28.2012.5.02.0465
      classe: Ação Trabalhista - Rito Ordinário
      classe_cnj_code: 0
      polo_ativo: ''
      polo_passivo: GRUPO FORD
    mov:
      mov_id: 9c251417-a595-40ae-8321-711b2e66a539
      data: '2025-02-21'
      tipo: publicacao
      texto: 'A C Ó R D Ã O



        (5ª Turma)



        GMMAR/arcs/abn






        AGRAVO EM AGRAVO DE INSTRUMENTO EM RECURSO DE REVISTA. ACÓRDÃO REGIONAL PUBLICADO NA VIGÊNCIA DA LEI Nº 13.467/2017.
        EXECUÇÃO. FATO NOVO. ADESÃO A PROGRAMA DE DESLIGAMENTO VOLUNTÁRIO. ACORDO EXTRAJUDICIAL. QUITAÇÃO. EFEITOS. INEXISTÊNCIA
        DE PREVISÃO EM NORMA COLETIVA. REEXAME DE FATOS E PROVAS. IMPOSSIBILIDADE. ÓBICE DA SÚMULA 126 DO TST. TRANSCENDÊNCIA
        NÃO RECONHECIDA. 1. A finalidade precípua desta Corte Superior, na uniformização de teses jurídicas, não autoriza
        a revisão do conjunto fático-probatório já analisado pelo Tribunal Regional, na esteira do entendimento consolidado
        pela Súmula 126/TST. 2. As alegações recursais da parte, no sentido de que há previsão de quitação geral do contrato
        de trabalho no acordo coletivo e no termo de adesão não encontram amparo no quadro fático delineado no acórdão regional
        no qual ausente registro de previsão em instrumento coletivo, com cláusula de quitação ampla e irrestrita. Desse modo,
        o acolhimento de suas pretensões demandaria necessariamente o reexame do acervo probatório, procedimento vedado nesta
        esfera extraordinária. 3. Assim, o Regional, ao concluir pela inexistência de quitação total do contrato de trabalho,
        decidiu de acordo com a Orientação Jurisprudencial 270 da SBDI-1. 4. Acrescente-se que em relação ao pleito sucessivo
        de compensação ou dedução, o acórdão regional está em consonância com a Orientação Jurisprudencial 356 da SBDI-1.
        Mantém-se a decisão recorrida. Agravo conhecido e desprovido.








        Vistos, relatados e discutidos estes autos de Agravo em Agravo de Instrumento em Recurso de Revista n° TST-Ag-AIRR-1826-28.2012.5.02.0465,
        em que é Agravante FORD MOTOR COMPANY BRASIL LTDA. e é Agravado CARLOS ENRIQUE SALAMANCA GAETE.






        Por meio da decisão monocrática ora atacada, neguei provimento ao agravo de instrumento.



        Irresignada, a executada interpôs agravo.



        Intimado, o agravado apresentou impugnação.



        É o relatório.





        V O T O





        ADMISSIBILIDADE



        Pr'
