# Polo-regression suite L1 mov_factsheet v1 — 10 cards curados manualmente
# cobrindo casos críticos historicamente buggy.
#
# Diferente do snapshot_v1 (sample random do banco), aqui cada caso eh
# CURADO com expected correto, validado contra a REGRA DE LEITURA DE POLOS
# do prompt L1 v2.1. Funciona como GATE DE REGRESSAO — se algum desses casos
# regredir, alguma mudanca no prompt quebrou a regra critica.
#
# Cobertura:
#   1-2: EF Tomador-executado, sentenca improcedente da execucao (Tomador GANHOU)
#   3-4: EF Tomador-executado, sentenca procedente da execucao (Tomador PERDEU)
#   5-6: Embargos Tomador-embargante, sentenca improcedente (Tomador PERDEU)
#   7-8: Anulatoria/MS Tomador-autor, sentenca procedente (Tomador GANHOU)
#   9:   Tutela Cautelar Antecedente extinta por perda objeto (Tomador-autor PERDEU)
#   10:  Recurso GOL/Uniao nao provido (paradigma 2026-05-25 — Uniao perdeu => GOL ganhou)

- description: "[POLO-REG 1] EF Tomador-executado: 'julgo improcedente a presente execucao fiscal' = sentido FAVORAVEL ao Tomador"
  vars:
    processo:
      cnj: "0000001-12.2020.4.03.6100"
      classe: "Execucao Fiscal"
      classe_cnj_code: 1116
      polo_ativo: "Uniao Federal - Fazenda Nacional"
      polo_passivo: "EMPRESA EXEMPLO LTDA"
    mov:
      mov_id: "polo-reg-1"
      data: "2024-08-15"
      tipo: "SENTENCA"
      texto: "Sentenca. Apos analise dos autos, reconheço a prescricao da pretensao executoria. Diante disso, JULGO IMPROCEDENTE a presente execucao fiscal. Custas pela exequente."
    documentos_anexados: []
    expected:
      decisao:
        tem_decisao: true
        sentido: "favoravel"
        natureza: "improcedente"
        instancia: "1g"
      categoria: "sentenca"
      relevancia_merito: "alta"
      peca_pivo:
        e_pivo: true

