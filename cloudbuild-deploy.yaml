steps:
  # ── GATE fail-closed (2026-07-26): unit tests ANTES de queimar imagem e deployar ──
  # Este deploy era kaniko -> gcloud run deploy, SEM verificacao nenhuma. Os 227
  # testes existem, rodam em 4s, nao tocam rede nem secret — e nunca rodaram em build
  # algum (o repo tambem nao tem CI de PR). O que passava batido e especificamente
  # QUEBRA DE CONTRATO com o garantis-shared em import LAZY (ex.
  # `from garantis_shared.engine_v6...derivacoes import` DENTRO da funcao, em
  # src/agents/mov_factsheet/agent.py:135): nao derruba o boot, entao o `run deploy`
  # conclui VERDE e o dano so aparece como 500 no hot path L1 -> l1_degraded ->
  # merito indeterminado. A suite importa 14 modulos do garantis_shared e tem canario
  # de pin de preco (test_vision_filter.py:24) — o mesmo drift que ja custou
  # "~US$25/semana invisivel" (comentario em src/providers/gemini.py:123-124).
  #
  # Canal de deps IDENTICO ao cloudbuild-eval.yaml (keyring + ADC do SA do Cloud
  # Build pro AR) e imagem IDENTICA a base do Dockerfile. DIFERENCA pro eval: sem
  # `set +e` e sem `|| exit 0` — pytest != 0 aborta o build e o kaniko NEM RODA.
  # (Os testes rodam em step proprio, e nao dentro da imagem, porque .dockerignore:12
  # exclui `tests/` e o Dockerfile so faz COPY de src/.)
  # Medido em python:3.11-slim (2026-07-26): install 61s + suite 4s.
  #
  # ⚠️ OS 8 --deselect JA ESTAO VERMELHOS EM master — sao o que este gate EXPOE, nao o
  # que ele protege. NAO cresca esta lista pra fazer build passar.
  #   7 deles sao STALE de texto de prompt (test_merito_synthesis_{consistency,routing}):
  #     assertam 'Tema 372' / 'Tema 725' / frases removidas DE PROPOSITO nos commits
  #     a0a82f8 (2026-05-25) e c4452ea (2026-06-20). Conserto = atualizar o assert.
  #   ⚠️ 1 NAO E STALE e NAO E de prompt:
  #     test_gemini_determinism.py::test_agents_pass_thinking_budget_zero le o
  #     FONTE (inspect.getsource) e exige `thinking_budget=0` E `temperature=0.0` nos
  #     3 agents. Ficou vermelho em 9425766 (2026-05-28, "Vision helper + safety caps"),
  #     que apagou `temperature=0.0` de src/agents/mov_factsheet/agent.py — hoje
  #     `grep -c temperature src/agents/mov_factsheet/` = 0, contra 4 e 2 nos outros
  #     dois agents. Era o UNICO guard automatico desse par, e variancia run-a-run do
  #     B1 e lane ABERTA. Repor a temperature muda saida de risco => precisa de OK
  #     explicito do Elton (CLAUDE.md raiz); por isso fica parado AQUI, nomeado.
  - name: 'python:3.11-slim'
    id: 'unit-tests'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -eo pipefail
        pip install --quiet --no-cache-dir keyrings.google-artifactregistry-auth
        PIP_EXTRA_INDEX_URL=https://southamerica-east1-python.pkg.dev/$PROJECT_ID/python-packages/simple/ \
          pip install --quiet --no-cache-dir -r requirements.txt
        pip install --quiet --no-cache-dir "pytest>=8.0.0" "pytest-asyncio>=0.24.0"
        python -m pytest -q -p no:cacheprovider \
          --deselect "tests/test_gemini_determinism.py::test_agents_pass_thinking_budget_zero" \
          --deselect "tests/test_merito_synthesis_consistency.py::test_consistency_check_lists_pro_alto_phrases" \
          --deselect "tests/test_merito_synthesis_consistency.py::test_consistency_check_releitura_explicit" \
          --deselect "tests/test_merito_synthesis_routing.py::test_rules_fiscal_keywords" \
          --deselect "tests/test_merito_synthesis_routing.py::test_rules_trabalhista_keywords" \
          --deselect "tests/test_merito_synthesis_routing.py::test_rules_misto_keywords_and_confidence" \
          --deselect "tests/test_merito_synthesis_routing.py::test_prompt_dispatch_by_dominant_tipo[fiscal-must_contain0-must_not_contain0]" \
          --deselect "tests/test_merito_synthesis_routing.py::test_prompt_dispatch_by_dominant_tipo[trabalhista-must_contain1-must_not_contain1]"
    timeout: '600s'

  # Build + push with Kaniko (cache enabled — pip install cached when requirements.txt unchanged)
  - name: 'gcr.io/kaniko-project/executor:latest'
    id: 'kaniko-build'
    waitFor: ['unit-tests']  # gate: imagem so e queimada com a suite verde
    args:
      - '--dockerfile=Dockerfile'
      - '--context=.'
      - '--destination=southamerica-east1-docker.pkg.dev/$PROJECT_ID/garantis-ai-agents/api:latest'
      - '--cache=true'
      - '--cache-ttl=168h'
      - '--cache-repo=southamerica-east1-docker.pkg.dev/$PROJECT_ID/garantis-ai-agents/api-cache'
      - '--snapshot-mode=redo'
    timeout: '600s'

  # PromptFoo regression eval moved to its own non-blocking build 2026-06-01.
  # It is warning-only (never fails the build), so gating `deploy` on it added
  # ~120s of wall-clock for zero safety. Now lives in cloudbuild-eval.yaml +
  # trigger `eval-garantis-ai-agents` — runs in parallel on the same push, off
  # the deploy critical path. See memory deploy-bottleneck-analysis-2026-06-01.

  # Deploy container image to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy'
    waitFor: ['kaniko-build']
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'garantis-ai-agents'
      - '--image'
      - 'southamerica-east1-docker.pkg.dev/$PROJECT_ID/garantis-ai-agents/api:latest'
      - '--region'
      - 'southamerica-east1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--min-instances'
      - '3'
      - '--max-instances'
      - '100'
      - '--memory'
      - '2Gi'
      - '--cpu'
      - '1'
      - '--timeout'
      - '300'
      - '--set-env-vars'
      # PR7.3 (2026-05-31): JURISPRUDENCIA_BLOCK_ENABLED + PARADIGMAS_BLOCK_ENABLED
      # dropados (zero callers Python pos-PR7.2 — blocos internos removidos).
      # L1_NEUTRAL_ENABLED (2026-06-10): FLIP PERMANENTE do v4 — agent mov_factsheet
      # emite fatos neutros (prompt/schema v4). Par de fe-api + risk-engine-worker.
      # VISION_L1_ENABLED (2026-06-13 ON -> 2026-06-17 OFF): default OFF (CLAUDE.md;
      # benchmark 05-28 sem lift + 1.2-2.4x custo). Ficou ON SO aqui no ai-agents
      # mas OFF no worker/fe-api -> estado meio-ligado: o worker (OFF) so carrega doc
      # COM texto, entao os doc-imagem que o Vision precisaria nunca chegavam aqui; o
      # Vision so tentava PDF dos docs-com-texto-e-anexo e dava 400 "document has no
      # pages" nos PDFs ruins -> l1_degraded -> indeterminado (dias de dano). Pra
      # retomar o experimento per-doc: ligar os 3 (worker+fe-api+ai-agents) JUNTOS +
      # tratar 0-page (pular PDF sem pagina em vez de falhar a mov).
      # 2026-06-29: condicoes atendidas -> FLIP PERSISTENTE pra true. Os 3 ligados
      # (services.yaml + cloudbuilds do worker/fe-api no PR execucao-fiscal#437) e o
      # 0-page guard ja entrou (PR garantis-ai-agents#65: stub-filter + try/except no
      # call_l1_with_vision_fallback). Custo limitado pelo gate ocr_gate (so doc-imagem).
      # GEMINI_RATE_LIMIT_TIMEOUT_S=180 (2026-06-16): era default 60 — em mérito GRANDE
      # (ex. Petrobras 25 procs) o fan-out de L1 satura o rate-limiter e o 1 call de L3
      # no fim não pega slot em 60s → acquire TimeoutError → 500 → engine desiste após
      # retries → merito fica indeterminado. 180s (< Cloud Run --timeout 300) dá folga.
      # EXITO_GATED_ON_JURIS=on (2026-06-22): gate de custo do L2 — pula a Call B
      # (probabilidade_exito) quando NAO ha sinal de jurisprudencia. Salvaguarda
      # resiliente-sem-juris + economia. Estava como --update-env-vars temp (rev
      # 00233); persistido aqui pra nao resetar no proximo deploy. Lido por
      # agents/processo_synthesis/agent.py::_exito_gate_enabled (default OFF no codigo).
      # MOV_TRIAGE_MODEL=gemini-2.5-flash (2026-06-27): a triagem L1 (mov_triage/agent.py)
      # roda no flash FULL, NAO no flash-lite. flash-lite da ~75% 503 ("high demand" =
      # quota COMPARTILHADA do Gemini) sob a rajada do cascade; flash FULL deu 0% 503 em
      # 715 calls medidos (memory l1-triage-503-burst-quota-semaphore-rootcause). PONTE ate
      # a fila DBOS de triagem + bump de quota flash-lite (GCP) deixarem lite voltar barato.
      # Estava --update-env-vars (rev 00242); persistido aqui pra nao resetar no proximo deploy.
      # GEMINI_BACKEND=vertex (2026-07-18): Gemini via Vertex AI (aiplatform) em vez do
      # AI Studio, que bateu o tier spending cap (US$250/mes, imposto pelo Google;
      # creditos GCP nao cobrem o AI Studio). Vertex = mesmos modelos, mesmo preco/token,
      # sem esse teto. Lido por garantis_shared.gemini_backend (default aistudio no codigo).
      # Reverter: trocar pra aistudio aqui + redeploy. Requer SA com roles/aiplatform.user.
      # Trilha A (2026-07-21, OK Elton): DEFAULT_MODEL 2.5-flash-lite -> 3.1-flash-lite e
      # MOV_TRIAGE_MODEL 2.5-flash -> 3.1-flash-lite (gold staging 16/26 vs 15/26; familia
      # transito-julgado nao reproduz). A ponte "flash FULL por 503 do 2.5-lite" (2026-06-27,
      # acima) fica HISTORICA — sob Vertex o 3.1-flash-lite nao tem aquela quota compartilhada.
      # NUNCA usar gemini-3.1-flash NAO-lite: nao existe no Vertex (404).
      - 'DEFAULT_MODEL=gemini-3.1-flash-lite,MOV_TRIAGE_MODEL=gemini-3.1-flash-lite,DEFAULT_PROMPT_VERSION=v3,TEMPLATES_POLETTO_ENABLED=true,BLOQUEIO_PROB_EXITO_ENABLED=true,L1_NEUTRAL_ENABLED=true,VISION_L1_ENABLED=true,GEMINI_RATE_LIMIT_TIMEOUT_S=180,EXITO_GATED_ON_JURIS=on,ENGINE_LLM_SEED_ENABLED=true,GEMINI_BACKEND=vertex'
      # Fase 3 vertex-sem-key (2026-07-21, OK Elton): GOOGLE_API_KEY=GEMINI_API_KEY:latest
      # REMOVIDO — auth e ADC do service account (GEMINI_BACKEND=vertex; provado em staging
      # 2026-07-21 rodando sem key nenhuma). --clear-secrets (e nao so tirar a flag) porque
      # sem ele o secret da revisao anterior fica grudado na proxima revisao. Era o UNICO
      # secret do servico (verificado no live 2026-07-21). Reverter: restaurar
      # `--set-secrets GOOGLE_API_KEY=GEMINI_API_KEY:latest` no lugar do clear.
      - '--clear-secrets'

options:
  logging: CLOUD_LOGGING_ONLY
