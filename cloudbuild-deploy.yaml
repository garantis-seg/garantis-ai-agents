steps:
  # Build + push with Kaniko (cache enabled — pip install cached when requirements.txt unchanged)
  - name: 'gcr.io/kaniko-project/executor:latest'
    id: 'kaniko-build'
    args:
      - '--dockerfile=Dockerfile'
      - '--context=.'
      - '--destination=southamerica-east1-docker.pkg.dev/$PROJECT_ID/garantis-ai-agents/api:latest'
      - '--cache=true'
      - '--cache-ttl=168h'
      - '--cache-repo=southamerica-east1-docker.pkg.dev/$PROJECT_ID/garantis-ai-agents/api-cache'
      - '--snapshot-mode=redo'
    timeout: '600s'

  # PromptFoo regression eval moved to its own non-blocking build 2026-06-01.
  # It is warning-only (never fails the build), so gating `deploy` on it added
  # ~120s of wall-clock for zero safety. Now lives in cloudbuild-eval.yaml +
  # trigger `eval-garantis-ai-agents` — runs in parallel on the same push, off
  # the deploy critical path. See memory deploy-bottleneck-analysis-2026-06-01.

  # Deploy container image to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy'
    waitFor: ['kaniko-build']
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'garantis-ai-agents'
      - '--image'
      - 'southamerica-east1-docker.pkg.dev/$PROJECT_ID/garantis-ai-agents/api:latest'
      - '--region'
      - 'southamerica-east1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--min-instances'
      - '3'
      - '--max-instances'
      - '100'
      - '--memory'
      - '2Gi'
      - '--cpu'
      - '1'
      - '--timeout'
      - '300'
      - '--set-env-vars'
      # PR7.3 (2026-05-31): JURISPRUDENCIA_BLOCK_ENABLED + PARADIGMAS_BLOCK_ENABLED
      # dropados (zero callers Python pos-PR7.2 — blocos internos removidos).
      # L1_NEUTRAL_ENABLED (2026-06-10): FLIP PERMANENTE do v4 — agent mov_factsheet
      # emite fatos neutros (prompt/schema v4). Par de fe-api + risk-engine-worker.
      # VISION_L1_ENABLED (2026-06-13): fallback vision-L1 — agent manda PDF cru pro
      # Gemini só pros doc-imagem (route-by-has_text). Sync com fe-api + worker.
      # GEMINI_RATE_LIMIT_TIMEOUT_S=180 (2026-06-16): era default 60 — em mérito GRANDE
      # (ex. Petrobras 25 procs) o fan-out de L1 satura o rate-limiter e o 1 call de L3
      # no fim não pega slot em 60s → acquire TimeoutError → 500 → engine desiste após
      # retries → merito fica indeterminado. 180s (< Cloud Run --timeout 300) dá folga.
      - 'DEFAULT_MODEL=gemini-2.5-flash-lite,DEFAULT_PROMPT_VERSION=v3,TEMPLATES_POLETTO_ENABLED=true,BLOQUEIO_PROB_EXITO_ENABLED=true,JURISPRUDENCE_PATH_ENABLED=new,L3_AB_TEST_ENABLED=true,L1_NEUTRAL_ENABLED=true,VISION_L1_ENABLED=true,GEMINI_RATE_LIMIT_TIMEOUT_S=180'
      - '--set-secrets'
      - 'GOOGLE_API_KEY=GEMINI_API_KEY:latest'

options:
  logging: CLOUD_LOGGING_ONLY
