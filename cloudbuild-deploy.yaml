steps:
  # ── GATE fail-closed (2026-07-26): unit tests ANTES de queimar imagem e deployar ──
  # Este deploy era kaniko -> gcloud run deploy, SEM verificacao nenhuma. Os 227
  # testes existem, rodam em 4s, nao tocam rede nem secret — e nunca rodaram em build
  # algum (o repo tambem nao tem CI de PR). O que passava batido e especificamente
  # QUEBRA DE CONTRATO com o garantis-shared em import LAZY (ex.
  # `from garantis_shared.engine_v6...derivacoes import` DENTRO da funcao, em
  # src/agents/mov_factsheet/agent.py:135): nao derruba o boot, entao o `run deploy`
  # conclui VERDE e o dano so aparece como 500 no hot path L1 -> l1_degraded ->
  # merito indeterminado. A suite importa 14 modulos do garantis_shared e tem canario
  # de pin de preco (test_vision_filter.py:24) — o mesmo drift que ja custou
  # "~US$25/semana invisivel" (comentario em src/providers/gemini.py:123-124).
  #
  # Canal de deps IDENTICO ao cloudbuild-eval.yaml (keyring + ADC do SA do Cloud
  # Build pro AR) e imagem IDENTICA a base do Dockerfile. DIFERENCA pro eval: sem
  # `set +e` e sem `|| exit 0` — pytest != 0 aborta o build e o kaniko NEM RODA.
  # (Os testes rodam em step proprio, e nao dentro da imagem, porque .dockerignore:12
  # exclui `tests/` e o Dockerfile so faz COPY de src/.)
  # Medido em python:3.11-slim (2026-07-26): install 61s + suite 4s.
  #
  # ⚠️ OS 7 --deselect JA ESTAO VERMELHOS EM master — sao o que este gate EXPOE, nao o
  # que ele protege. NAO cresca esta lista pra fazer build passar.
  # Sao todos STALE de texto de prompt (test_merito_synthesis_{consistency,routing}):
  # assertam 'Tema 372' / 'Tema 725' / frases removidas DE PROPOSITO nos commits
  # a0a82f8 (2026-05-25) e c4452ea (2026-06-20). Conserto = atualizar o assert.
  #
  # (Havia um 8o — test_gemini_determinism::test_agents_pass_thinking_budget_zero.
  #  Foi INVESTIGADO em vez de parqueado: o commit 9425766 (2026-05-28) nao perdeu o
  #  guard, EXTRAIU a chamada do L1 pro helper `_utils/vision.py` e a `temperature=0.0`
  #  desceu junto. Medido no boundary do SDK com o modelo de prod, o L1 sai com
  #  temperature=0.0 nos dois ramos. Era o TESTE que olhava o modulo errado — corrigido
  #  neste mesmo PR, com mutation testing (pega `thinking_budget=8192` no agent E
  #  `temperature=0.7` no helper; a versao ingenua deixava as duas passarem).)
  - name: 'python:3.11-slim'
    id: 'unit-tests'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -eo pipefail
        pip install --quiet --no-cache-dir keyrings.google-artifactregistry-auth
        PIP_EXTRA_INDEX_URL=https://southamerica-east1-python.pkg.dev/$PROJECT_ID/python-packages/simple/ \
          pip install --quiet --no-cache-dir -r requirements.txt
        pip install --quiet --no-cache-dir "pytest>=8.0.0" "pytest-asyncio>=0.24.0"
        python -m pytest -q -p no:cacheprovider \
          --deselect "tests/test_merito_synthesis_consistency.py::test_consistency_check_lists_pro_alto_phrases" \
          --deselect "tests/test_merito_synthesis_consistency.py::test_consistency_check_releitura_explicit" \
          --deselect "tests/test_merito_synthesis_routing.py::test_rules_fiscal_keywords" \
          --deselect "tests/test_merito_synthesis_routing.py::test_rules_trabalhista_keywords" \
          --deselect "tests/test_merito_synthesis_routing.py::test_rules_misto_keywords_and_confidence" \
          --deselect "tests/test_merito_synthesis_routing.py::test_prompt_dispatch_by_dominant_tipo[fiscal-must_contain0-must_not_contain0]" \
          --deselect "tests/test_merito_synthesis_routing.py::test_prompt_dispatch_by_dominant_tipo[trabalhista-must_contain1-must_not_contain1]"
    timeout: '600s'

  # Build + push with Kaniko (cache enabled — pip install cached when requirements.txt unchanged)
  - name: 'gcr.io/kaniko-project/executor:latest'
    id: 'kaniko-build'
    waitFor: ['unit-tests']  # gate: imagem so e queimada com a suite verde
    args:
      - '--dockerfile=Dockerfile'
      - '--context=.'
      # Imagem pinada por ${BUILD_ID} (2026-07-30): o deploy abaixo puxa a tag
      # IMUTÁVEL deste build, nunca :latest. Dois builds concorrentes re-empurrando
      # :latest faziam o deploy resolver a imagem do OUTRO build — incidente
      # 2026-07-18 no fe-api (builds #680/#682: /v2/filters 404 em prod com PR
      # mergeado + build SUCCESS). Mesmo padrão que o fe-api desde 2026-07-19.
      # :latest segue publicada só como tag de conveniência; NUNCA deployar por ela.
      - '--destination=southamerica-east1-docker.pkg.dev/$PROJECT_ID/garantis-ai-agents/api:${BUILD_ID}'
      - '--destination=southamerica-east1-docker.pkg.dev/$PROJECT_ID/garantis-ai-agents/api:latest'
      - '--cache=true'
      - '--cache-ttl=168h'
      - '--cache-repo=southamerica-east1-docker.pkg.dev/$PROJECT_ID/garantis-build-cache/garantis-ai-agents-cache'
      - '--snapshot-mode=redo'
    timeout: '600s'

  # PromptFoo regression eval moved to its own non-blocking build 2026-06-01.
  # It is warning-only (never fails the build), so gating `deploy` on it added
  # ~120s of wall-clock for zero safety. Now lives in cloudbuild-eval.yaml +
  # trigger `eval-garantis-ai-agents` — runs in parallel on the same push, off
  # the deploy critical path. See memory deploy-bottleneck-analysis-2026-06-01.

  # Deploy container image to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy'
    waitFor: ['kaniko-build']
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'garantis-ai-agents'
      - '--image'
      - 'southamerica-east1-docker.pkg.dev/$PROJECT_ID/garantis-ai-agents/api:${BUILD_ID}'
      - '--region'
      - 'southamerica-east1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--min-instances'
      - '3'
      - '--max-instances'
      - '100'
      # RISCO CONHECIDO (2026-08-14, NAO endereçado neste PR — decisão de custo
      # é do dono): memória/CPU/concurrency continuam nos valores de hoje (2Gi /
      # 1 CPU / concurrency default 80). Quando o `/doc-indexer/indexar` ligar de
      # verdade (`FICHAS_DOC_INDEXER_ENABLED`), PyMuPDF abrindo PDF grande
      # (centenas de páginas, OCR) com até 80 requests SIMULTÂNEAS na mesma
      # instância pode estourar 2Gi => OOM kill (503 em TODAS as requests da
      # instância, não só na pesada). Quem for ligar o indexador precisa decidir
      # antes: subir memória, baixar `--concurrency`, ou os dois.
      - '--memory'
      - '2Gi'
      - '--cpu'
      - '1'
      # 900s (2026-08-14): o timeout do Cloud Run é o TETO de todos os clientes,
      # e estava ABAIXO deles — 300s aqui contra TIMEOUT_CALCULADOR_S=600 do
      # `/calculo-ficha/montar-grafo` e TIMEOUT_INDEXADOR_S=900 do
      # `/doc-indexer/indexar` (garantis_shared/.../c4_agentes.py). O efeito não
      # era "demora": o Cloud Run cortava a request no meio (504) com o custo do
      # LLM JÁ PAGO e sem resposta para o cliente. O teto passa a ser o maior
      # timeout de cliente (900s = o do indexador, §8.3 do desenho).
      - '--timeout'
      - '900'
      - '--set-env-vars'
      # PR7.3 (2026-05-31): JURISPRUDENCIA_BLOCK_ENABLED + PARADIGMAS_BLOCK_ENABLED
      # dropados (zero callers Python pos-PR7.2 — blocos internos removidos).
      # L1_NEUTRAL_ENABLED (2026-06-10): FLIP PERMANENTE do v4 — agent mov_factsheet
      # emite fatos neutros (prompt/schema v4). Par de fe-api + risk-engine-worker.
      # VISION_L1_ENABLED (2026-06-13 ON -> 2026-06-17 OFF): default OFF (CLAUDE.md;
      # benchmark 05-28 sem lift + 1.2-2.4x custo). Ficou ON SO aqui no ai-agents
      # mas OFF no worker/fe-api -> estado meio-ligado: o worker (OFF) so carrega doc
      # COM texto, entao os doc-imagem que o Vision precisaria nunca chegavam aqui; o
      # Vision so tentava PDF dos docs-com-texto-e-anexo e dava 400 "document has no
      # pages" nos PDFs ruins -> l1_degraded -> indeterminado (dias de dano). Pra
      # retomar o experimento per-doc: ligar os 3 (worker+fe-api+ai-agents) JUNTOS +
      # tratar 0-page (pular PDF sem pagina em vez de falhar a mov).
      # 2026-06-29: condicoes atendidas -> FLIP PERSISTENTE pra true. Os 3 ligados
      # (services.yaml + cloudbuilds do worker/fe-api no PR execucao-fiscal#437) e o
      # 0-page guard ja entrou (PR garantis-ai-agents#65: stub-filter + try/except no
      # call_l1_with_vision_fallback). Custo limitado pelo gate ocr_gate (so doc-imagem).
      # GEMINI_RATE_LIMIT_TIMEOUT_S=180 (2026-06-16): era default 60 — em mérito GRANDE
      # (ex. Petrobras 25 procs) o fan-out de L1 satura o rate-limiter e o 1 call de L3
      # no fim não pega slot em 60s → acquire TimeoutError → 500 → engine desiste após
      # retries → merito fica indeterminado. 180s (< Cloud Run --timeout 300) dá folga.
      # EXITO_GATED_ON_JURIS=on (2026-06-22): gate de custo do L2 — pula a Call B
      # (probabilidade_exito) quando NAO ha sinal de jurisprudencia. Salvaguarda
      # resiliente-sem-juris + economia. Estava como --update-env-vars temp (rev
      # 00233); persistido aqui pra nao resetar no proximo deploy. Lido por
      # agents/processo_synthesis/agent.py::_exito_gate_enabled (default OFF no codigo).
      # MOV_TRIAGE_MODEL=gemini-2.5-flash (2026-06-27): a triagem L1 (mov_triage/agent.py)
      # roda no flash FULL, NAO no flash-lite. flash-lite da ~75% 503 ("high demand" =
      # quota COMPARTILHADA do Gemini) sob a rajada do cascade; flash FULL deu 0% 503 em
      # 715 calls medidos (memory l1-triage-503-burst-quota-semaphore-rootcause). PONTE ate
      # a fila DBOS de triagem + bump de quota flash-lite (GCP) deixarem lite voltar barato.
      # Estava --update-env-vars (rev 00242); persistido aqui pra nao resetar no proximo deploy.
      # GEMINI_BACKEND=vertex (2026-07-18): Gemini via Vertex AI (aiplatform) em vez do
      # AI Studio, que bateu o tier spending cap (US$250/mes, imposto pelo Google;
      # creditos GCP nao cobrem o AI Studio). Vertex = mesmos modelos, mesmo preco/token,
      # sem esse teto. Lido por garantis_shared.gemini_backend (default aistudio no codigo).
      # Reverter: trocar pra aistudio aqui + redeploy. Requer SA com roles/aiplatform.user.
      # Trilha A (2026-07-21, OK Elton): DEFAULT_MODEL 2.5-flash-lite -> 3.1-flash-lite e
      # MOV_TRIAGE_MODEL 2.5-flash -> 3.1-flash-lite (gold staging 16/26 vs 15/26; familia
      # transito-julgado nao reproduz). A ponte "flash FULL por 503 do 2.5-lite" (2026-06-27,
      # acima) fica HISTORICA — sob Vertex o 3.1-flash-lite nao tem aquela quota compartilhada.
      # NUNCA usar gemini-3.1-flash NAO-lite: nao existe no Vertex (404).
      # CALCULO_FICHA_MODEL + AUDITOR_EVIDENCIAS_MODEL (2026-08-13, QA B1 achado A-1):
      # os DOIS precisam estar aqui, EXPLICITOS. Os agentes do C4 leem
      # `CALCULO_FICHA_MODEL or DEFAULT_MODEL or <default>` (calculo_ficha/agent.py) e
      # `AUDITOR_EVIDENCIAS_MODEL or DEFAULT_MODEL or <default>` (auditor_evidencias/agent.py):
      # com DEFAULT_MODEL setado e as especificas AUSENTES, os dois colapsam no MESMO
      # modelo (medido: ambos gemini-3.1-flash-lite) e a premissa central do desenho cai
      # EM SILENCIO — auditar com o mesmo modelo que calculou e pedir a alguem que revise
      # o proprio trabalho; dois erros correlacionados se confirmam mutuamente e o auditor
      # nao tem como sinalizar. Os valores abaixo replicam os defaults DO CODIGO (nao sao
      # escolha nova): auditor no flash. Cruzar PROVIDER (nao so versao) e a decisao em
      # aberto — do Alfredo, nao deste fix. Guard: o teste
      # test_calculador_e_auditor_usam_modelos_diferentes_por_default parseia ESTE arquivo.
      # ⚠️ CALCULO_FICHA_MODEL 3.1-pro-preview -> 3.5-flash (2026-08-13, decisao do dono):
      # o `gemini-3.1-pro-preview` DAVA 404 no Vertex (e aqui roda GEMINI_BACKEND=vertex,
      # abaixo), entao o calculador nao respondia em prod; e como o id nao existe em
      # llm_models.MODELS, get_model_pricing() devolvia 0/0 e o custo saia ZERADO do ledger
      # (mesmo mecanismo dos US$ 97,61 em 39.309 calls). 3.5-flash esta no catalogo
      # (1.50/9.00, preco de fatura) e nao e preview. A proposta formal de ROLES pra fichas
      # e o PR #345 do garantis-shared — este aqui e so o fix do bug.
      # FICHA_WRITER_MODEL + FICHA_AUDITORIA_TEXTO_MODEL (2026-08-13, S6 auditor de
      # ficha): a MESMA doutrina do A-1 aplicada ao par redator(S4) x auditor(S6).
      # O redator lia `FICHA_WRITER_MODEL or DEFAULT_MODEL or <default>` e, sem a
      # env, resolvia pro DEFAULT_MODEL; se o auditor tambem herdasse, os dois
      # rodariam em gemini-3.1-flash-lite e o S6 seria o redator revisando a
      # propria prosa — reprovacao nenhuma, gate ligado, ficha aprovada em
      # silencio. Por isso DUAS defesas: `resolver_modelo()` do auditor NAO le
      # DEFAULT_MODEL (so a env propria -> ROLES -> literal), e as duas envs estao
      # EXPLICITAS aqui com valores DIFERENTES. Guard: o teste
      # test_cloudbuild_seta_o_modelo_do_auditor_de_ficha parseia ESTE arquivo.
      # Trocar por PROVIDER diferente (nao so versao) segue em aberto — do Alfredo.
      # (resolução 155×156: S6 em 3.5-flash — o 2.5-flash do PR aposenta 2026-10-16;
      #  writer segue 3.1-flash-lite = no-op; par redator×auditor continua distinto.)
      - 'DEFAULT_MODEL=gemini-3.1-flash-lite,MOV_TRIAGE_MODEL=gemini-3.1-flash-lite,CALCULO_FICHA_MODEL=gemini-3.5-flash,AUDITOR_EVIDENCIAS_MODEL=gemini-2.5-flash,FICHA_WRITER_MODEL=gemini-3.1-flash-lite,FICHA_AUDITORIA_TEXTO_MODEL=gemini-3.5-flash,DEFAULT_PROMPT_VERSION=v3,BLOQUEIO_PROB_EXITO_ENABLED=true,L1_NEUTRAL_ENABLED=true,VISION_L1_ENABLED=true,L1_DECISAO_EXIGE_CORPO=true,L1_DECISAO_EXIGE_DISPOSITIVO=true,GEMINI_RATE_LIMIT_TIMEOUT_S=180,EXITO_GATED_ON_JURIS=on,ENGINE_LLM_SEED_ENABLED=true,GEMINI_BACKEND=vertex'
      # Fase 3 vertex-sem-key (2026-07-21, OK Elton): GOOGLE_API_KEY=GEMINI_API_KEY:latest
      # REMOVIDO — auth e ADC do service account (GEMINI_BACKEND=vertex; provado em staging
      # 2026-07-21 rodando sem key nenhuma). --clear-secrets (e nao so tirar a flag) porque
      # sem ele o secret da revisao anterior fica grudado na proxima revisao. Era o UNICO
      # secret do servico (verificado no live 2026-07-21). Reverter: restaurar
      # `--set-secrets GOOGLE_API_KEY=GEMINI_API_KEY:latest` no lugar do clear.
      - '--clear-secrets'

  # ------------------------------------------------------------------
  # Sombra: staging passa a SEGUIR prod. Espelha o `deploy-staging-sombra` do
  # frontend-api, que e por que o staging DELE nao deriva.
  #
  # POR QUE EXISTE (medido 2026-08-05): o reconcile diario tem um check de
  # STAGING_FRESHNESS pro par (garantis-ai-agents, garantis-ai-agents-staging),
  # mas nao havia MECANISMO nenhum que atualizasse o staging. Resultado: a
  # ultima revisao do staging era de 2026-07-21 e o check acusava 223h de
  # atraso (teto 48h) — vermelho todo dia, sem ninguem pra consertar, porque
  # re-apontar a mao so reseta o relogio e volta a divergir no proximo deploy
  # de prod. Check sem mecanismo e alarme sem conserto.
  #
  # SO A IMAGEM, de proposito. `services update --image` preserva env e
  # secrets, entao staging mantem a config PROPRIA dele (que pode divergir de
  # prod por decisao) e so o CODIGO segue. E exatamente o que o gate mede: ele
  # compara digest de imagem e trata img_prod == img_stg como "em dia por
  # definicao" (lint-services-yaml.py::freshness_drift). Copiar a lista de env
  # como o fe-api faz seria duplicar config que ninguem pediu pra duplicar.
  #
  # NUNCA derruba o build: prod ja foi deployado no step anterior, entao falhar
  # aqui pintaria de vermelho um deploy que deu certo — e build vermelho e
  # alerta no Slack (`build-failures-alert`). O backstop de falha PERSISTENTE e
  # o proprio reconcile diario, que volta a acusar STAGING_STALE em ate 48h.
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-staging-sombra'
    waitFor: ['deploy']
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -uo pipefail
        IMG='southamerica-east1-docker.pkg.dev/$PROJECT_ID/garantis-ai-agents/api:${BUILD_ID}'
        echo "sombra: mesma imagem de prod -> garantis-ai-agents-staging"
        if gcloud run services update garantis-ai-agents-staging \
             --image="$$IMG" --region=southamerica-east1 --quiet; then
          echo "sombra OK"
        else
          echo "AVISO: sombra do staging falhou (prod ja esta no ar; o reconcile diario acusa se persistir)"
        fi
        exit 0

options:
  logging: CLOUD_LOGGING_ONLY
